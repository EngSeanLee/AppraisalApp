name: JewelryAppraisal
options:
  bundleIdPrefix: com.tonysjewelry
  deploymentTarget:
    # 17+ because the views use the two-parameter .onChange(of:) API
    # (SE-0384). Fine for a personal/TestFlight-only install — Tony's
    # phone doesn't need to support old-iOS App Store users.
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.0
    DEVELOPMENT_TEAM: "" # TODO: fill in once the Apple Developer Program account exists

targets:
  JewelryAppraisal:
    type: application
    platform: iOS
    sources:
      - path: App
        # App/Resources (Assets.xcassets etc.) is nested under App and picked
        # up automatically — xcodegen treats .xcassets as a resource even
        # inside a "sources" folder, so no separate "resources:" entry needed.
    info:
      # `path` is required even in generate-mode — it's where XcodeGen writes
      # the Info.plist it builds from `properties` below, not a reference to
      # an existing file (missing it is what broke CI run #1: "Decoding
      # failed at 'path': Nothing found"). Kept outside App/ so it isn't also
      # swept up as a resource by the `sources: - path: App` entry above.
      # Generated on every `xcodegen generate`, so it's gitignored like the
      # .xcodeproj.
      path: Generated/Info.plist
      properties:
        UILaunchScreen: {}
        NSSpeechRecognitionUsageDescription: "Used to fill appraisal fields by voice instead of typing."
        NSMicrophoneUsageDescription: "Used to listen while you speak an appraisal field."
        NSCameraUsageDescription: "Used to photograph the jewelry piece for the appraisal."
        NSPhotoLibraryAddUsageDescription: "Used to save the exported appraisal PDF."
        # Exposes the app's Documents folder in the Files app (On My
        # iPhone → JewelryAppraisal) — that's where PDFExportService
        # writes every exported appraisal, so it's always sitting there
        # right after export with no extra save step. Everything else
        # (photos, saved-appraisal records) deliberately lives in
        # Application Support instead, which these two keys do NOT expose
        # — see PhotoStorage.swift / AppraisalStore.swift.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInBrowser: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tonysjewelry.appraisal
        TARGETED_DEVICE_FAMILY: "1" # iPhone only
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  JewelryAppraisalTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: JewelryAppraisal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tonysjewelry.appraisal.tests

schemes:
  JewelryAppraisal:
    build:
      targets:
        JewelryAppraisal: all
        JewelryAppraisalTests: [test]
    test:
      targets:
        - JewelryAppraisalTests
    run:
      config: Debug
